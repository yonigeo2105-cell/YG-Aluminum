<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>יהונתן אלומיניום PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0d47a1; --primary-light: #42a5f5; --bg: #f0f4f8; --card: #ffffff; --text-dark: #1a202c; --whatsapp: #25D366; --border: #cbd5e0; --input-bg: #f7fafc; --danger: #e53e3e; }
        body { font-family: 'Rubik', sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--text-dark); -webkit-tap-highlight-color: transparent; height: 100vh; overflow-x: hidden; }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0d47a1 0%, #002171 100%); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: opacity 0.5s; }
        .login-box { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 80%; max-width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-box h2 { color: var(--primary); margin-top: 0; margin-bottom: 10px; }
        .btn-login { background: var(--primary); color: white; width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .login-box input { width: 90%; margin-bottom: 10px; text-align: center; font-size: 20px; letter-spacing: 2px; border: 1px solid #ccc; padding: 10px; border-radius: 8px; }

        header { background: linear-gradient(135deg, var(--primary) 0%, #1976d2 100%); color: white; padding: 30px 20px 30px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 28px; font-weight: 800; }
        
        .container { padding: 20px; max-width: 650px; margin: 0 auto; padding-bottom: 140px; }
        .card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid white; }
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: 700; color: var(--primary); }
        .btn-delete { background: #fff5f5; color: var(--danger); border: 1px solid #fed7d7; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; background-color: var(--input-bg); margin-bottom: 15px; font-family: 'Rubik', sans-serif; box-sizing: border-box; }
        
        .row { display: flex; gap: 12px; } .row > div { flex: 1; }
        .btn-add-item { background: white; color: var(--primary); border: 2px dashed var(--primary-light); padding: 15px; border-radius: 15px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; flex: 2;}
        .btn-save-draft { background: #4a5568; color: white; border: none; padding: 15px; border-radius: 15px; font-size: 16px; font-weight: 700; cursor: pointer; flex: 1;}
        
        .bottom-actions { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px 20px 25px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1); z-index: 100; border-radius: 20px 20px 0 0; display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 16px 10px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; text-align: center; }
        .btn-calc { background: linear-gradient(90deg, var(--primary) 0%, #1565c0 100%); color: white; }
        .btn-pdf { background: #e53e3e; color: white; }
        .btn-sketches-pdf { background: #2d3748; color: white; }

        .result-box { background: white; border-radius: 20px; border: 2px solid var(--primary-light); margin-top: 25px; display: none; overflow: hidden; margin-bottom: 20px; }
        .result-header { background: var(--primary-light); color: white; padding: 15px; text-align: center; font-weight: 700; }
        .result-body { padding: 20px; }
        .price-line { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .total-line { font-size: 24px; font-weight: 800; color: var(--primary); border-top: 2px dashed #cbd5e0; padding-top: 15px; margin-top: 15px; display: flex; justify-content: space-between; }

        .extra-panel { background: #f8fafc; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e2e8f0; display: none; }
        .btn-download-sketch { background-color: #2d3748; color: white; padding: 12px; border-radius: 8px; font-size: 15px; border: none; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-add-profile { background: var(--primary); color: white; border: none; border-radius: 10px; padding: 0 16px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 15px; white-space: nowrap; }
        
        .modal-overlay { position: fixed; top: 0; right: 0; left: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 95%; max-width: 450px; border-radius: 20px; padding: 20px; max-height: 90vh; display: flex; flex-direction: column; overflow-y: auto; }
        canvas#drawingPad { border: 2px dashed #cbd5e0; border-radius: 10px; touch-action: none; background: white; cursor: crosshair; width: 100%; height: 300px; }

        .shower-options { background: #fff; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .checkbox-row { display: flex; align-items: center; margin-bottom: 8px; }
        .checkbox-row input { width: 20px; height: 20px; margin: 0 0 0 10px; }

        /* אזור ההדפסה הנסתר במסך רגיל */
        #printArea { display: none; }

        /* הגדרות הדפסה (כאשר פותחים את חלון ה-PDF של המכשיר) */
        @media print {
            body * { visibility: hidden !important; }
            #printArea, #printArea * { visibility: visible !important; }
            #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; direction: rtl; background: white; padding: 20px; }
            @page { size: A4 portrait; margin: 1.5cm; }
            body { background: white; }
        }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <div style="font-size: 40px; margin-bottom: 10px;">🛡️</div>
        <h2>כניסה למערכת</h2>
        <p>נא להקיש סיסמה</p>
        <input type="password" id="passwordInput" placeholder="****" inputmode="numeric">
        <button class="btn-login" onclick="checkLogin()">היכנס</button>
        <div id="draftBtnContainer" style="display:none; margin-top:20px;">
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin-bottom:15px;">
            <button class="btn-login" style="background:#2b6cb0;" onclick="loadDraft()">📂 המשך טיוטה אחרונה</button>
        </div>
        <p id="loginError" style="color:red; font-size:12px; margin-top:10px; display:none;">סיסמה שגויה</p>
    </div>
</div>

<header>
    <h1>יהונתן אלומיניום</h1>
    <p style="margin:5px 0 0; opacity:0.9;">מערכת הצעות מחיר</p>
</header>

<div class="container" id="mainApp" style="display:none">
    <div class="card">
        <div class="card-title">👤 פרטי לקוח</div>
        <label>שם הלקוח:</label>
        <input type="text" id="clientName" placeholder="ישראל ישראלי">
        <div class="row">
            <div style="flex:1"><label>תאריך:</label><input type="date" id="quoteDate"></div>
            <div style="flex:1"><label>מס' הצעה:</label><input type="number" id="quoteNumber" style="font-weight:700;text-align:center"></div>
        </div>
    </div>
    
    <div id="itemsContainer"></div>
    
    <div class="row" style="margin-bottom:20px;">
        <button class="btn-add-item" onclick="addItem()">➕ הוסף מוצר</button>
        <button class="btn-save-draft" onclick="saveDraft()">💾 שמור טיוטה</button>
    </div>
    
    <div class="card" style="background:#ebf8ff; border:1px solid #bee3f8;">
        <div class="card-title">🛠️ תוספות והתקנה</div>
        <label>עלות הובלה, התקנה ופירוק (₪):</label>
        <input type="number" id="installationCost" placeholder="0">
    </div>
    
    <div class="result-box" id="resultBox">
        <div class="result-header">סיכום הזמנה</div>
        <div class="result-body">
            <div class="price-line"><span>סה"כ מוצרים:</span><span id="itemsSubtotal">0 ₪</span></div>
            <div class="price-line"><span>תוספות והתקנה:</span><span id="installSubtotal">0 ₪</span></div>
            <div class="price-line" style="border-top:1px solid #eee; padding-top:10px;"><span>סה"כ לפני מע"מ:</span><span id="totalSub">0 ₪</span></div>
            <div class="price-line"><span>מע"מ (18%):</span><span id="totalVat">0 ₪</span></div>
            <div class="total-line"><span>סה"כ לתשלום:</span><span id="totalFinal">0 ₪</span></div>
            
            <button class="btn-action" style="margin-top:20px; width:100%; background:var(--whatsapp); color:white;" onclick="openPreview()">שלח הצעה בוואטסאפ</button>
        </div>
    </div>
</div>

<div class="bottom-actions" id="bottomNav" style="display:none">
    <button class="btn-action btn-calc" onclick="calculateAll()">חשב סה"כ</button>
    <button class="btn-action btn-pdf" onclick="printInvoice()">📄 הצעת מחיר (PDF)</button>
    <button class="btn-action btn-sketches-pdf" onclick="printAllSketches()">📐 דף שרטוטים</button>
</div>

<div class="modal-overlay" id="previewModal">
    <div class="modal-content">
        <h3 style="text-align:center;margin:0 0 15px 0;color:var(--primary)">טיוטת הודעה</h3>
        <textarea id="previewText" style="width:100%; height:150px; font-family:sans-serif; border:1px solid #ccc; padding:10px; border-radius:10px;"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-login" style="background:#ccc; color:black" onclick="document.getElementById('previewModal').style.display='none'">סגור</button>
            <button class="btn-login" style="background:var(--whatsapp)" onclick="sendWhatsapp()">שלח</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="drawingModal">
    <div class="modal-content" style="max-width:500px">
        <h3 style="text-align:center;margin:0 0 10px 0;">לוח שרטוט ידני</h3>
        <canvas id="drawingPad" width="450" height="300"></canvas>
        <div class="row" style="margin-top:15px">
             <button class="btn-login" style="background:#e53e3e; flex:1" onclick="clearCanvas()">נקה</button>
             <button class="btn-login" style="background:var(--whatsapp); flex:1" onclick="saveDrawing()">שמור שרטוט</button>
             <button class="btn-login" style="background:#ccc; flex:1" onclick="closeDrawing()">ביטול</button>
        </div>
    </div>
</div>

<div id="printArea"></div>

<script>
    // --- רשימת פרופילים עצמאית המאפשרת שילוב חופשי עם כל סוג מוצר + הוספה מהאפליקציה ---
    const defaultProfilesList = [
        "קליל 7000 קלאסי", "קליל 9000", "קליל 9200", "קליל 1700 בלגי", "קליל 2200 אופיס",
        "קליל 4500 קלאסי", "קליל 4300 בלגי", "קליל 5500 באוהאוס", "קליל 4400", "קליל 2000 בייסיק",
        "כיס בודד (2 נתיבים)", "כיס בודד (3 נתיבים)", "כיס כפול (2 נתיבים)", "כיס כפול (3 נתיבים)",
        "דלת 2000 פנל", "דלת לובי זכוכית", "דלת אינטרקום",
        "שלב 8 (רגיל)", "שלב אור (מיני)", "שלב מוקצף",
        "רשת גלילה (אנכית)", "רשת הזזה", "רשת קבועה",
        "פרופיל הייטק 120/40", "פרופיל הייטק 150/50", "פרופיל דאבל T", "פרופיל 100/100", "רפפות Z", "רפפות אליפטיות", "דמוי עץ",
        "גדר שלבים אופקיים", "גדר הייטק",
        "מקלחון צירים יוקרתי", "מקלחון הזזה", "אמבטיון"
    ];

    function getAllProfiles() {
        const custom = JSON.parse(localStorage.getItem('customAlumProfiles') || '[]');
        return [...new Set([...defaultProfilesList, ...custom])];
    }

    function populateProfileSelect(selectEl, selectedVal) {
        const current = selectedVal || selectEl.value;
        selectEl.innerHTML = "";
        getAllProfiles().forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            opt.innerText = p;
            if (p === current) opt.selected = true;
            selectEl.appendChild(opt);
        });
    }

    function addNewProfilePrompt(btn) {
        const newProf = prompt("הזן שם סוג פרופיל חדש:");
        if (newProf && newProf.trim() !== "") {
            const cleanProf = newProf.trim();
            const custom = JSON.parse(localStorage.getItem('customAlumProfiles') || '[]');
            if (!custom.includes(cleanProf) && !defaultProfilesList.includes(cleanProf)) {
                custom.push(cleanProf);
                localStorage.setItem('customAlumProfiles', JSON.stringify(custom));
            }
            document.querySelectorAll('.profile-select').forEach(sel => {
                populateProfileSelect(sel, sel.value);
            });
            const currentSelect = btn.closest('.card').querySelector('.profile-select');
            currentSelect.value = cleanProf;
        }
    }

    const glassTypes = {
        "types": [
            "טריפלקס 3+3", "טריפלקס 3+4", "טריפלקס 3+5", "טריפלקס 3+6",
            "טריפלקס 4+4", "טריפלקס 4+5", "טריפלקס 4+6",
            "טריפלקס 5+5", "טריפלקס 6+6", "טריפלקס 8+8",
            "בידודית 4-6-4", "בידודית 4-9-4", "בידודית 4-12-4", "בידודית 4-16-4",
            "בידודית 5-9-5", "בידודית 6-9-6", "בידודית 6-12-6",
            "בידודית עם צלון פנימי",
            "מחוסמת 4 מ\"מ", "מחוסמת 5 מ\"מ", "מחוסמת 6 מ\"מ", "מחוסמת 8 מ\"מ", "מחוסמת 10 מ\"מ", "מחוסמת 12 מ\"מ",
            "רגילה 4 מ\"מ", "רגילה 5 מ\"מ", "רגילה 6 מ\"מ"
        ],
        "finish": [
            "שקוף (Clear)", "חלבי (Matte)", "חום (Bronze)", "אפור (Grey)", "ירוק", "כחול",
            "רפלקטיבי (מראה)", "צ'ינצ'ילה", "סבתא", "גרניט", "פסים/תריס"
        ]
    };
    
    const showerGlass = ["מחוסמת 6 מ\"מ", "מחוסמת 8 מ\"מ"];

    let itemCount = 0;
    let activeDrawingBtn = null; 
    
    document.addEventListener('DOMContentLoaded', () => { 
        document.getElementById('quoteDate').valueAsDate = new Date();
        const savedNum = localStorage.getItem('quoteCounter'); 
        document.getElementById('quoteNumber').value = savedNum ? savedNum : 1; 
        if(localStorage.getItem('myAlumDraft')) document.getElementById('draftBtnContainer').style.display = 'block';
    });

    function checkLogin() {
        if(document.getElementById('passwordInput').value === '1234') {
            document.getElementById('loginScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loginScreen').style.display = 'none';
                document.querySelector('.container').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
            }, 500);
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    // --- שמירת וטעינת טיוטות ---
    function saveDraft() {
        document.querySelectorAll('input, select, textarea').forEach(el => {
            if(el.type === 'checkbox') { if(el.checked) el.setAttribute('checked', 'checked'); else el.removeAttribute('checked'); }
            else { 
                el.setAttribute('value', el.value);
                if(el.tagName === 'TEXTAREA') el.innerText = el.value;
                if(el.tagName === 'SELECT') {
                    Array.from(el.options).forEach(opt => {
                        if(opt.value === el.value || opt.text === el.value) opt.setAttribute('selected', 'selected');
                        else opt.removeAttribute('selected');
                    });
                }
            }
        });
        const data = {
            html: document.getElementById('itemsContainer').innerHTML,
            client: document.getElementById('clientName').value,
            qDate: document.getElementById('quoteDate').value,
            qNum: document.getElementById('quoteNumber').value,
            install: document.getElementById('installationCost').value,
            itemCount: itemCount
        };
        localStorage.setItem('myAlumDraft', JSON.stringify(data));
        alert('הטיוטה נשמרה בהצלחה במכשיר!');
    }

    function loadDraft() {
        const data = JSON.parse(localStorage.getItem('myAlumDraft'));
        if(!data) return;
        document.getElementById('clientName').value = data.client || '';
        document.getElementById('quoteDate').value = data.qDate || '';
        document.getElementById('quoteNumber').value = data.qNum || '';
        document.getElementById('installationCost').value = data.install || '';
        document.getElementById('itemsContainer').innerHTML = data.html || '';
        itemCount = data.itemCount || 0;
        
        document.getElementById('itemsContainer').querySelectorAll('input, select, textarea').forEach(el => {
            if(el.type === 'checkbox') el.checked = el.hasAttribute('checked');
            else if(el.tagName === 'SELECT') { const selectedOpt = el.querySelector('option[selected]'); if(selectedOpt) el.value = selectedOpt.value; }
            else el.value = el.getAttribute('value') || '';
        });
        
        document.getElementById('loginScreen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loginScreen').style.display = 'none';
            document.querySelector('.container').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
        }, 500);
    }

    // --- הוספת מוצרים ---
    function addItem() {
        itemCount++;
        const container = document.getElementById('itemsContainer');
        const div = document.createElement('div');
        div.className = 'card fade-in item-card';
        div.id = `item-${itemCount}`;
        
        div.innerHTML = `
            <div class="card-header-row">
                <div class="card-title">מוצר #${itemCount}</div>
                <button class="btn-delete" onclick="this.closest('.card').remove()">מחק</button>
            </div>

            <label>בחר סוג מוצר:</label>
            <select class="item-type" onchange="updateItemFields(this)">
                <option value="sliding">חלון הזזה</option>
                <option value="pocket">חלון כיס (Pocket)</option>
                <option value="hinge">חלון ציר (רגיל)</option>
                <option value="kipp">חלון קיפ (פתיחה עליונה)</option>
                <option value="tilt_turn">חלון דריי-קיפ (משולב)</option>
                <option value="fixed">חלון קבוע (FIX)</option>
                <option value="showcase">ויטרינה קבועה (Showcase)</option>
                <option value="door">דלתות כניסה / לובי</option>
                <option value="shutter">תריסים</option>
                <option value="screen_roll">רשתות</option>
                <option value="pergola">פרגולות</option>
                <option value="fence">גדרות</option>
                <option value="shower">מקלחונים</option>
                <option value="joker">כללי</option>
            </select>

            <div class="extra-panel"></div>

            <div class="standard-inputs">
                <label>סוג פרופיל:</label>
                <div style="display:flex; gap:8px; align-items:stretch;">
                    <select class="profile-select" style="flex:1;"></select>
                    <button type="button" class="btn-add-profile" onclick="addNewProfilePrompt(this)">➕ הוסף</button>
                </div>
                
                <div class="alum-color-section">
                    <label style="margin-top:10px">גוון אלומיניום:</label>
                    <input type="text" class="color-shade" placeholder="הקלד גוון ידנית (למשל: לבן 9016 / IRON 420)">
                </div>

                <div class="glass-section">
                    <label style="margin-top:10px">זכוכית:</label>
                    <div class="row">
                        <select class="glass-type"></select>
                        <select class="glass-finish"></select>
                    </div>
                </div>

                <div class="dims-section">
                    <div class="row" style="margin-top:15px">
                        <div><label>רוחב (ס"מ)</label><input type="number" class="w-input" placeholder="100"></div>
                        <div><label>גובה (ס"מ)</label><input type="number" class="h-input" placeholder="100"></div>
                    </div>
                </div>
                
                <div class="row" style="margin-top:10px;">
                     <div class="opening-dir-container" style="display:none; flex:1">
                        <label>כיוון פתיחה:</label>
                        <select class="open-dir">
                            <option value="right">ימין</option>
                            <option value="left">שמאל</option>
                        </select>
                     </div>
                </div>

                <div class="row">
                    <div><label>כמות</label><input type="number" class="qty-input" value="1"></div>
                    <div><label style="color:var(--primary)">מחיר יח' (₪)</label><input type="number" class="price-input" placeholder="מחיר פיקס"></div>
                </div>
                
                <button class="btn-download-sketch" onclick="generateSketch(this)">📸 צור שרטוט אדריכלי</button>

    let canvas, ctx, isDrawing = false;
    function initCanvas() {
        canvas = document.getElementById('drawingPad');
        ctx = canvas.getContext('2d');
        ctx.fillStyle = "white"; ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.strokeStyle = "black"; ctx.lineWidth = 3; ctx.lineCap = "round";
        canvas.addEventListener('touchstart', startDraw); canvas.addEventListener('touchmove', draw); canvas.addEventListener('touchend', stopDraw);
        canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDraw);
    }
    function startDraw(e) { isDrawing = true; draw(e); }
    function stopDraw() { isDrawing = false; ctx.beginPath(); }
    function draw(e) {
        if (!isDrawing) return; e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    }
    function clearCanvas() { ctx.fillStyle="white"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.beginPath(); }
    function saveDrawing() {
        const dataURL = canvas.toDataURL();
        const container = activeDrawingBtn.closest('.joker-panel').querySelector('.img-container');
        const img = container.querySelector('.img-display');
        img.src = dataURL;
        container.style.display = 'block';
        closeDrawing();
    }

    // --- חישובים ותצוגה ---
    function calculateAll() {
        let itemsSum = 0;
        document.querySelectorAll('.item-card').forEach(card => {
            const type = card.querySelector('.item-type').value;
            let q, p;
            if(type === 'joker') {
                q = parseFloat(card.querySelector('.qty-input-joker').value) || 1;
                p = parseFloat(card.querySelector('.price-input-joker').value) || 0;
            } else {
                q = parseFloat(card.querySelector('.qty-input').value) || 1;
                p = parseFloat(card.querySelector('.price-input').value) || 0;
            }
            itemsSum += (q * p);
        });
        const install = parseFloat(document.getElementById('installationCost').value) || 0;
        const totalSub = itemsSum + install;
        const vat = totalSub * 0.18; 
        const final = totalSub + vat;
        document.getElementById('itemsSubtotal').innerText = itemsSum.toLocaleString() + " ₪";
        document.getElementById('installSubtotal').innerText = install.toLocaleString() + " ₪";
        document.getElementById('totalSub').innerText = totalSub.toLocaleString() + " ₪";
        document.getElementById('totalVat').innerText = vat.toLocaleString() + " ₪";
        document.getElementById('totalFinal').innerText = final.toLocaleString() + " ₪";
        document.getElementById('resultBox').style.display = 'block';
        setTimeout(() => document.getElementById('bottomNav').scrollIntoView({behavior:'smooth'}), 200);
    }

                        <th style="width:15%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:center; -webkit-print-color-adjust: exact; print-color-adjust: exact;">מידות (ס"מ)</th>
                        <th style="width:10%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:center; -webkit-print-color-adjust: exact; print-color-adjust: exact;">כמות</th>
                        <th style="width:10%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:right; -webkit-print-color-adjust: exact; print-color-adjust: exact;">מחיר יח'</th>
                        <th style="width:15%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:right; -webkit-print-color-adjust: exact; print-color-adjust: exact;">סה"כ</th>
                    </tr>

        let index = 1; let itemsSum = 0;
        document.querySelectorAll('.item-card').forEach(card => {

                qty = parseFloat(card.querySelector('.qty-input-joker').value) || 1;
                price = parseFloat(card.querySelector('.price-input-joker').value) || 0;
                dims = "-";
            } else {
                const profile = card.querySelector('.profile-select').value;
                
                if (type !== 'shower') {
                     const shade = card.querySelector('.color-shade').value || "לפי בחירה";
                     desc += `<br>פרופיל: ${profile}<br>צבע: ${shade}`;
                } else {
                     const hwColor = card.querySelector('.hardware-color').value;
                     desc += `<br>דגם: ${profile}<br>פרזול: ${hwColor}`;
                }

                if(type !== 'pergola' && type !== 'fence' && type !== 'shutter' && type !== 'screen_roll') {
                    const glass = card.querySelector('.glass-type').value;
                    const finish = card.querySelector('.glass-finish').value;
                    desc += `<br>זכוכית: ${glass}, ${finish}`;
                }
                
                desc += getExtrasText(card).replace(/\n/g, '<br>');
                
                if (type === 'fixed' || type === 'showcase') {
                     const hR = card.querySelector('.h-right-input').value;
                     const hL = card.querySelector('.h-left-input').value;
                     dims = `${card.querySelector('.w-input').value} / ${hR}-${hL}`;
                } else if (type === 'shower') {
                     const config = card.querySelector('.shower-config').value;
                     const h = card.querySelector('.h-input').value;
                     if (config === 'front') dims = `${card.querySelector('.w-input').value} / ${h}`;
                     else dims = `${card.querySelector('.w-right-input').value}x${card.querySelector('.w-left-input').value} / ${h}`;
                } else {
                     dims = `${card.querySelector('.w-input').value} / ${card.querySelector('.h-input').value}`;
                }
                
                qty = parseFloat(card.querySelector('.qty-input').value) || 1;
                price = parseFloat(card.querySelector('.price-input').value) || 0;
            }
            const total = qty * price; itemsSum += total;
            
            const bgColor = index % 2 === 0 ? 'background-color:#f9f9f9 !important;' : '';
            htmlContent += `<tr style="${bgColor} -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                <td style="padding:10px; border:1px solid #ddd;">${index++}</td>
                <td style="padding:10px; border:1px solid #ddd;">${desc}</td>
                <td style="padding:10px; border:1px solid #ddd; direction:ltr; text-align:center">${dims}</td>
                <td style="padding:10px; border:1px solid #ddd; text-align:center">${qty}</td>
                <td style="padding:10px; border:1px solid #ddd;">${price.toLocaleString()} ₪</td>
                <td style="padding:10px; border:1px solid #ddd;">${total.toLocaleString()} ₪</td>
            </tr>`;
        });

        const install = parseFloat(document.getElementById('installationCost').value) || 0;
        const totalBeforeVat = itemsSum + install;
        const vat = totalBeforeVat * 0.18;
        const finalTotal = totalBeforeVat + vat;

        htmlContent += `
                </tbody>
            </table>
            <div style="float:left; width:350px; margin-top:30px; background:#f8f9fa !important; padding:15px; border:1px solid #ddd; border-radius:8px; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:15px;"><span>סה"כ מוצרים + התקנה:</span><span>${totalBeforeVat.toLocaleString()} ₪</span></div>
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:15px;"><span>מע"מ (18%):</span><span>${vat.toLocaleString()} ₪</span></div>
                <div style="display:flex; justify-content:space-between; padding:10px 0 0 0; margin-top:10px; border-top:2px solid #0d47a1; font-size:18px; font-weight:bold; color:#0d47a1;"><span>סה"כ לתשלום:</span><span>${finalTotal.toLocaleString()} ₪</span></div>
            </div>
            <div style="clear:both"></div>
            <div style="margin-top:60px; font-size:12px; color:#555; border-top:1px solid #ccc; padding-top:15px; line-height: 1.8;">
                * המחיר כולל הובלה והתקנה.<br>* הצעת מחיר זאת משמשת כחוזה עבודה.<br>* הסחורה בבעלות יהונתן אלומיניום עד התשלום המלא.<br>* הצעת מחיר תקפה ל-5 ימי עסקים.<br><strong>בכבוד רב, יהונתן אלומיניום</strong>
            </div>
        `;

        document.getElementById('printArea').innerHTML = htmlContent;
        window.print();
    }

    // --- יצירת קנבס שרטוט לפי כרטיסיית מוצר (משמש גם להורדה בודדת וגם לדף שרטוטים מרוכז) ---
    function createSketchCanvas(card) {
        const typeSelect = card.querySelector('.item-type');
        const type = typeSelect.value;
        const typeName = typeSelect.options[typeSelect.selectedIndex].text; 
        const profile = card.querySelector('.profile-select') ? card.querySelector('.profile-select').value : '';
        
        const canvas = document.createElement('canvas');
        canvas.width = 1200; canvas.height = 900;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = "white"; ctx.fillRect(0,0,1200,900);
        ctx.fillStyle = "#0d47a1"; ctx.font = "bold 40px Arial"; ctx.textAlign = "center";
        ctx.fillText("יהונתן אלומיניום", 600, 60);
        ctx.fillStyle = "#333"; ctx.font = "24px Arial";
        const client = document.getElementById('clientName').value || "לקוח";
        ctx.fillText(`לקוח: ${client} | תאריך: ${new Date().toLocaleDateString('he-IL')}`, 600, 100);
        
        let title = `${typeName} - ${profile}`;
        if(type === 'pergola' && card.querySelector('.prg-type').value === 'stand') title += ` | גובה עמוד: ${card.querySelector('.prg-post-h').value} ס"מ`;
        
        const cbMono = card.querySelector('.cb-monoblock');
        let hasMonoblock = (cbMono && cbMono.checked);
        let monoH = 0; if(hasMonoblock) { monoH = parseFloat(card.querySelector('.mono-h').value) || 28; title += ` | מונובלוק`; }

        ctx.font = "20px Arial"; ctx.fillStyle = "#555";
        ctx.fillText(title, 600, 140);
        
        let w, h, hRight, hLeft;
        const maxDrawW = 700; const maxDrawH = 500;
        let dw, dh, startX, startY;

        if (type === 'fixed' || type === 'showcase') {
             w = parseFloat(card.querySelector('.w-input').value) || 100;
             hRight = parseFloat(card.querySelector('.h-right-input').value) || 100;
             hLeft = parseFloat(card.querySelector('.h-left-input').value) || 100;
             h = Math.max(hRight, hLeft);
        } else if (type === 'shower') {
             h = parseFloat(card.querySelector('.h-input').value) || 190;
             if (card.querySelector('.shower-config').value === 'front') w = parseFloat(card.querySelector('.w-input').value) || 100;
             else w = (parseFloat(card.querySelector('.w-right-input').value)||80) + (parseFloat(card.querySelector('.w-left-input').value)||80) + 20; 
        } else {
             w = parseFloat(card.querySelector('.w-input').value) || 100;
             h = parseFloat(card.querySelector('.h-input').value) || 100;
        }

        const ratio = w / h;
        if (ratio > 1) { dw = maxDrawW; dh = maxDrawW / ratio; if(dh > maxDrawH){ dh = maxDrawH; dw = dh * ratio; } }
        else { dh = maxDrawH; dw = maxDrawH * ratio; if(dw > maxDrawW){ dw = maxDrawW; dh = dw / ratio; } }
        
        startX = (1200 - dw) / 2;
        startY = 250;
        const origStartY = startY; const origDh = dh; 
        
        ctx.strokeStyle = "#333"; ctx.lineWidth = 3;

        if(hasMonoblock) {
            const boxPxH = (monoH / h) * dh;
            ctx.fillStyle = "#f0f0f0"; ctx.fillRect(startX, startY, dw, boxPxH);
            ctx.strokeRect(startX, startY, dw, boxPxH);
            ctx.beginPath(); ctx.lineWidth = 1;
            for(let y=10; y<boxPxH; y+=10) { ctx.moveTo(startX, startY+y); ctx.lineTo(startX+dw, startY+y); }
            ctx.stroke(); ctx.lineWidth = 3;
            startY += boxPxH; dh -= boxPxH; 
        }

        if (type === 'shower') {
             const conf = card.querySelector('.shower-config').value;
             const hwColor = card.querySelector('.hardware-color').value;
             ctx.strokeStyle = (hwColor === 'שחור מט') ? 'black' : '#888'; 
             
             if (conf === 'front') {
                 ctx.strokeRect(startX, startY, dw, dh);
                 const layout = card.querySelector('.shower-layout-type').value;
                 if (layout === '2wing') {
                     ctx.beginPath(); ctx.moveTo(startX+dw/2, startY); ctx.lineTo(startX+dw/2, startY+dh); ctx.stroke();
                     drawTriangle(ctx, startX, startY, dw/2, dh, 'left'); drawTriangle(ctx, startX+dw/2, startY, dw/2, dh, 'right');
                 } else if (layout === 'fix_wing') {
                     ctx.beginPath(); ctx.moveTo(startX+dw*0.4, startY); ctx.lineTo(startX+dw*0.4, startY+dh); ctx.stroke();
                     ctx.beginPath(); ctx.moveTo(startX+dw*0.4, startY+50); ctx.lineTo(startX, startY); ctx.stroke(); 
                     drawTriangle(ctx, startX+dw*0.4, startY, dw*0.6, dh, 'right');
                 }
             } else {
                 const wR = parseFloat(card.querySelector('.w-right-input').value)||80;
                 const wL = parseFloat(card.querySelector('.w-left-input').value)||80;
                 const pxR = (wR / (wR+wL)) * dw; const pxL = (wL / (wR+wL)) * dw;
                 ctx.strokeRect(startX + pxL + 10, startY, pxR, dh); ctx.strokeRect(startX, startY, pxL, dh);
                 ctx.lineWidth = 5; ctx.strokeStyle = "#0d47a1"; 
                 ctx.beginPath(); ctx.moveTo(startX+pxL+5, startY); ctx.lineTo(startX+pxL+5, startY+dh); ctx.stroke();
                 ctx.lineWidth = 3; ctx.strokeStyle = (hwColor === 'שחור מט') ? 'black' : '#888';
                 const typeR = card.querySelector('.shower-side-r').value; const typeL = card.querySelector('.shower-side-l').value;
                 if(typeL === 'wing') drawTriangle(ctx, startX, startY, pxL, dh, 'left');
                 if(typeR === 'wing') drawTriangle(ctx, startX+pxL+10, startY, pxR, dh, 'right');
             }
             ctx.fillStyle = "#0d47a1"; ctx.font = "bold 24px Arial"; 
             if (conf === 'front') ctx.fillText(w, startX+dw/2, startY-10);
             else { 
                 const wR = parseFloat(card.querySelector('.w-right-input').value)||80; const wL = parseFloat(card.querySelector('.w-left-input').value)||80;
                 ctx.fillText(wL, startX + (dw*(wL/(wL+wR))/2), startY-10); ctx.fillText(wR, startX + dw - (dw*(wR/(wL+wR))/2), startY-10);
             }
        }
        else if (type === 'fixed' || type === 'showcase') {
             const pixHRight = (hRight / h) * dh; const pixHLeft = (hLeft / h) * dh;
             ctx.beginPath(); ctx.moveTo(startX, startY + dh); ctx.lineTo(startX + dw, startY + dh); ctx.lineTo(startX + dw, startY + dh - pixHRight); ctx.lineTo(startX, startY + dh - pixHLeft); ctx.closePath();
             ctx.save(); ctx.clip(); ctx.stroke();
             const cols = parseInt(card.querySelector('.div-x').value) || 0; const rows = parseInt(card.querySelector('.div-y').value) || 0;
             if (cols > 0) { const colW = dw / (cols + 1); for (let i = 1; i <= cols; i++) { ctx.beginPath(); ctx.moveTo(startX + i * colW, startY); ctx.lineTo(startX + i * colW, startY + dh + 100); ctx.stroke(); } }
             if (rows > 0) { const rowH = dh / (rows + 1); for (let j = 1; j <= rows; j++) { ctx.beginPath(); ctx.moveTo(startX, startY + dh - j * rowH); ctx.lineTo(startX + dw, startY + dh - j * rowH); ctx.stroke(); } }
             ctx.restore();
             ctx.beginPath(); ctx.moveTo(startX, startY + dh); ctx.lineTo(startX + dw, startY + dh); ctx.lineTo(startX + dw, startY + dh - pixHRight); ctx.lineTo(startX, startY + dh - pixHLeft); ctx.closePath(); ctx.stroke();
        }
        else if (type === 'sliding') {
            ctx.strokeRect(startX, startY, dw, dh);
            const sashes = parseInt(card.querySelector('.sl-sashes').value) || 2; const sashW = dw / sashes;
            for(let i=0; i<sashes; i++) {
                const offset = (i % 2 === 0) ? 0 : 15;
                ctx.strokeRect(startX+(i*sashW)+offset, startY+10, sashW-10, dh-20);
                drawArrow(ctx, startX+(i*sashW)+sashW/2, startY+dh/2, (i%2===0)?'right':'left');
            }
        }
        else if (type === 'pocket') {
            const dir = card.querySelector('.pkt-dir').value; ctx.setLineDash([10, 10]); 
            if (dir === 'right') { ctx.strokeRect(startX + dw, startY, 150, dh); drawArrow(ctx, startX + dw - 50, startY + dh/2, 'right'); } 
            else { ctx.strokeRect(startX - 150, startY, 150, dh); drawArrow(ctx, startX + 50, startY + dh/2, 'left'); }
            ctx.setLineDash([]); ctx.strokeRect(startX, startY, dw, dh); 
        }
        else if (['hinge', 'tilt_turn', 'door'].includes(type)) {
            ctx.strokeRect(startX, startY, dw, dh); 
            if(type !== 'door') ctx.strokeRect(startX+10, startY+10, dw-20, dh-20);
            const dir = card.querySelector('.open-dir').value;
            drawTriangle(ctx, startX, startY, dw, dh, dir);
            if(type === 'tilt_turn') drawTriangle(ctx, startX, startY, dw, dh, 'top');
            if(type === 'door') { 
                ctx.beginPath(); ctx.lineWidth=5;
                if(dir === 'right') { ctx.moveTo(startX+20, startY+dh/2); ctx.lineTo(startX+50, startY+dh/2); }
                else { ctx.moveTo(startX+dw-20, startY+dh/2); ctx.lineTo(startX+dw-50, startY+dh/2); }
                ctx.stroke(); ctx.lineWidth=3;
            }
        }
        else if (type === 'kipp') {
            ctx.strokeRect(startX, startY, dw, dh); ctx.strokeRect(startX+10, startY+10, dw-20, dh-20);
            drawTriangle(ctx, startX, startY, dw, dh, 'top'); 
        }
        else if (type === 'shutter') {
             const isHidden = card.querySelector('.sht-box').value === 'hidden'; const boxH = dh * 0.15;
             if(isHidden) { ctx.setLineDash([5,5]); ctx.strokeRect(startX, startY-boxH, dw, boxH); ctx.setLineDash([]); }
             else { ctx.fillStyle = "#ddd"; ctx.fillRect(startX, startY-boxH, dw, boxH); ctx.strokeRect(startX, startY-boxH, dw, boxH); }
             ctx.strokeRect(startX, startY, dw, dh);
             for(let y=0; y<dh; y+=25) { ctx.strokeRect(startX, startY+y, dw, 23); }
        }
        else if (type === 'pergola') {
            const roofH = dh * 0.15; 
            ctx.fillStyle = "#eee"; ctx.fillRect(startX - 15, startY, dw + 30, roofH); 
            ctx.lineWidth = 4; ctx.strokeStyle = "#333"; ctx.strokeRect(startX - 15, startY, dw + 30, roofH);
            const dir = card.querySelector('.prg-dir').value;
            ctx.strokeStyle = "#777"; ctx.lineWidth = 2; 
            if(dir === 'width' || dir === 'grid') { for(let y=startY; y<startY+roofH; y+=15) { ctx.beginPath(); ctx.moveTo(startX-15, y); ctx.lineTo(startX+dw+15, y); ctx.stroke(); } }
            if(dir === 'length' || dir === 'grid') { for(let x=startX; x<startX+dw; x+=15) { ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, startY+roofH); ctx.stroke(); } }
            ctx.strokeRect(startX, startY + 5, dw, roofH - 10);
        }
        else if(type === 'fence') {
             ctx.strokeRect(startX, startY, dw, dh);
             const spaceCm = parseInt(card.querySelector('.fence-space').value) || 2; const spacePx = spaceCm * 5; 
             for(let y=10; y<dh; y += (10 + spacePx)) { ctx.fillRect(startX, startY+y, dw, 10); }
        }
        else if (type !== 'shower') { ctx.strokeRect(startX, startY, dw, dh); }

        if (type !== 'shower') {
            ctx.strokeStyle = "#0000aa"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(startX, origStartY+origDh+20); ctx.lineTo(startX, origStartY+origDh+50); ctx.moveTo(startX+dw, origStartY+origDh+20); ctx.lineTo(startX+dw, origStartY+origDh+50); ctx.moveTo(startX, origStartY+origDh+35); ctx.lineTo(startX+dw, origStartY+origDh+35); ctx.stroke();
            ctx.fillStyle = "#0000aa"; ctx.font = "bold 30px Arial"; ctx.textAlign = "center"; ctx.fillText(`${w}`, startX+dw/2, origStartY+origDh+65);
            
            if (type === 'fixed' || type === 'showcase') {
                 ctx.save(); ctx.translate(startX+dw+65, origStartY+origDh/2); ctx.rotate(-Math.PI/2); ctx.fillText(`${hRight}`, 0, 0); ctx.restore();
                 ctx.save(); ctx.translate(startX-65, origStartY+origDh/2); ctx.rotate(Math.PI/2); ctx.fillText(`${hLeft}`, 0, 0); ctx.restore();
            } else {
                 ctx.save(); ctx.translate(startX+dw+65, origStartY+origDh/2); ctx.rotate(-Math.PI/2); ctx.fillText(`${h}`, 0, 0); ctx.restore();
            }
        }
        return canvas;
    }

    function generateSketch(btn) {
        const card = btn.closest('.card');
        const type = card.querySelector('.item-type').value;
        const client = document.getElementById('clientName').value || "לקוח";
        const canvas = createSketchCanvas(card);
        const link = document.createElement('a');
        link.download = `Sketch_${client}_${type}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }

    // --- הפקת דף שרטוטים מרוכז לכל המוצרים יחד ---

            alert("לא הוזנו מוצרים להפקת שרטוטים.");

        let htmlContent = `
            <div style="text-align:center; margin-bottom:30px; border-bottom:3px solid #0d47a1; padding-bottom:15px;">
                <h1 style="margin:0; color:#0d47a1; font-size:28px;">יהונתן אלומיניום - נספח שרטוטים</h1>
                <div style="display:flex; justify-content:space-between; margin-top:20px; font-weight:bold; font-size:15px;">
                    <span>לקוח: ${clientName}</span>
                    <span>תאריך: ${quoteDate}</span>

                const desc = card.querySelector('.joker-desc').value || '';

                        <div style="font-size:13px; color:#444; margin-bottom:8px;">${desc}</div>
                        ${imgSrc ? `<img src="${imgSrc}" style="max-width:100%; max-height:240px; object-fit:contain;">` : `<div style="padding:40px 0; color:#999;">ללא שרטוט</div>`}

                const qty = card.querySelector('.qty-input').value || 1;
                htmlContent += `

                        <div style="font-size:12px; color:#333; margin-bottom:6px;">פרופיל: ${profile} | גוון: ${color}</div>
                        <img src="${dataUrl}" style="width:100%; height:auto; display:block; margin:0 auto;">
                    </div>
                `;
            }
        });

        htmlContent += `</div>`;
        document.getElementById('printArea').innerHTML = htmlContent;
        setTimeout(() => window.print(), 150);
    }

    function drawArrow(ctx, x, y, dir) {
        ctx.beginPath(); ctx.lineWidth = 2;
        if (dir === 'right') { ctx.moveTo(x-20, y); ctx.lineTo(x+20, y); ctx.lineTo(x+10, y-10); ctx.moveTo(x+20, y); ctx.lineTo(x+10, y+10); }
        else { ctx.moveTo(x+20, y); ctx.lineTo(x-20, y); ctx.lineTo(x-10, y-10); ctx.moveTo(x-20, y); ctx.lineTo(x-10, y+10); }
        ctx.stroke(); ctx.lineWidth = 3;
    }

    function drawTriangle(ctx, x, y, w, h, dir) {
        ctx.setLineDash([15, 15]); ctx.lineWidth = 2; ctx.beginPath();
        if (dir === 'right') { ctx.moveTo(x, y); ctx.lineTo(x+w, y+h/2); ctx.lineTo(x, y+h); }
        else if (dir === 'left') { ctx.moveTo(x+w, y); ctx.lineTo(x, y+h/2); ctx.lineTo(x+w, y+h); }
        else if (dir === 'top') { ctx.moveTo(x, y+h); ctx.lineTo(x+w/2, y); ctx.lineTo(x+w, y+h); }
        ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 3;
    }
</script>
