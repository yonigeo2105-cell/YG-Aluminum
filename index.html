<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>יהונתן אלומיניום PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0d47a1; --primary-light: #42a5f5; --bg: #f0f4f8; --card: #ffffff; --text-dark: #1a202c; --whatsapp: #25D366; --border: #cbd5e0; --input-bg: #f7fafc; --danger: #e53e3e; }
        body { font-family: 'Rubik', sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--text-dark); -webkit-tap-highlight-color: transparent; height: 100vh; overflow-x: hidden; }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0d47a1 0%, #002171 100%); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: opacity 0.5s; }
        .login-box { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 80%; max-width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-box h2 { color: var(--primary); margin-top: 0; margin-bottom: 10px; }
        .btn-login { background: var(--primary); color: white; width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .login-box input { width: 90%; margin-bottom: 10px; text-align: center; font-size: 20px; letter-spacing: 2px; border: 1px solid #ccc; padding: 10px; border-radius: 8px; }

        header { background: linear-gradient(135deg, var(--primary) 0%, #1976d2 100%); color: white; padding: 30px 20px 30px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 28px; font-weight: 800; }
        
        .container { padding: 20px; max-width: 650px; margin: 0 auto; padding-bottom: 140px; }
        .card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid white; }
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: 700; color: var(--primary); }
        .btn-delete { background: #fff5f5; color: var(--danger); border: 1px solid #fed7d7; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; background-color: var(--input-bg); margin-bottom: 15px; font-family: 'Rubik', sans-serif; box-sizing: border-box; }
        
        .row { display: flex; gap: 12px; } .row > div { flex: 1; }
        .btn-add-item { background: white; color: var(--primary); border: 2px dashed var(--primary-light); padding: 15px; border-radius: 15px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; flex: 2;}
        .btn-save-draft { background: #4a5568; color: white; border: none; padding: 15px; border-radius: 15px; font-size: 16px; font-weight: 700; cursor: pointer; flex: 1;}
        
        .bottom-actions { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px 20px 25px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1); z-index: 100; border-radius: 20px 20px 0 0; display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; text-align: center; }
        .btn-calc { background: linear-gradient(90deg, var(--primary) 0%, #1565c0 100%); color: white; }
        .btn-pdf { background: #e53e3e; color: white; }

        .result-box { background: white; border-radius: 20px; border: 2px solid var(--primary-light); margin-top: 25px; display: none; overflow: hidden; margin-bottom: 20px; }
        .result-header { background: var(--primary-light); color: white; padding: 15px; text-align: center; font-weight: 700; }
        .result-body { padding: 20px; }
        .price-line { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .total-line { font-size: 24px; font-weight: 800; color: var(--primary); border-top: 2px dashed #cbd5e0; padding-top: 15px; margin-top: 15px; display: flex; justify-content: space-between; }

        .color-tabs { display: flex; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 15px; }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600; border-radius: 9px; cursor: pointer; color: #718096; transition: all 0.2s; }
        .tab.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .extra-panel { background: #f8fafc; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e2e8f0; display: none; }
        .btn-download-sketch { background-color: #2d3748; color: white; padding: 12px; border-radius: 8px; font-size: 15px; border: none; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .modal-overlay { position: fixed; top: 0; right: 0; left: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 95%; max-width: 450px; border-radius: 20px; padding: 20px; max-height: 90vh; display: flex; flex-direction: column; overflow-y: auto; }
        canvas#drawingPad { border: 2px dashed #cbd5e0; border-radius: 10px; touch-action: none; background: white; cursor: crosshair; width: 100%; height: 300px; }

        .shower-options { background: #fff; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .checkbox-row { display: flex; align-items: center; margin-bottom: 8px; }
        .checkbox-row input { width: 20px; height: 20px; margin: 0 0 0 10px; }

        .svg-preview-container { text-align:center; margin-top:15px; padding:15px; background:#f8fafc; border:2px dashed #cbd5e0; border-radius:10px; display:none; }

        /* הגדרות הדפסה */
        #printArea { display: none; }
        @media print {
            body * { visibility: hidden !important; }
            #printArea, #printArea * { visibility: visible !important; }
            #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; direction: rtl; background: white; padding: 20px; }
            @page { size: A4 portrait; margin: 1.5cm; }
            body { background: white; }
        }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <div style="font-size: 40px; margin-bottom: 10px;">🛡️</div>
        <h2>כניסה למערכת</h2>
        <p>נא להקיש סיסמה</p>
        <input type="password" id="passwordInput" placeholder="****" inputmode="numeric">
        <button class="btn-login" onclick="checkLogin()">היכנס</button>
        <div id="draftBtnContainer" style="display:none; margin-top:20px;">
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin-bottom:15px;">
            <button class="btn-login" style="background:#2b6cb0;" onclick="loadDraft()">📂 המשך טיוטה אחרונה</button>
        </div>
        <p id="loginError" style="color:red; font-size:12px; margin-top:10px; display:none;">סיסמה שגויה</p>
    </div>
</div>

<header>
    <h1>יהונתן אלומיניום</h1>
    <p style="margin:5px 0 0; opacity:0.9;">מערכת הצעות מחיר</p>
</header>

<div class="container" id="mainApp" style="display:none">
    <div class="card">
        <div class="card-title">👤 פרטי לקוח</div>
        <label>שם הלקוח:</label>
        <input type="text" id="clientName" placeholder="ישראל ישראלי">
        <div class="row">
            <div style="flex:1"><label>תאריך:</label><input type="date" id="quoteDate"></div>
            <div style="flex:1"><label>מס' הצעה:</label><input type="number" id="quoteNumber" style="font-weight:700;text-align:center"></div>
        </div>
    </div>
    
    <div id="itemsContainer"></div>
    
    <div class="row" style="margin-bottom:20px;">
        <button class="btn-add-item" onclick="addItem()">➕ הוסף מוצר</button>
        <button class="btn-save-draft" onclick="saveDraft()">💾 שמור טיוטה</button>
    </div>
    
    <div class="card" style="background:#ebf8ff; border:1px solid #bee3f8;">
        <div class="card-title">🛠️ תוספות והתקנה</div>
        <label>עלות הובלה, התקנה ופירוק (₪):</label>
        <input type="number" id="installationCost" placeholder="0">
    </div>
    
    <div class="result-box" id="resultBox">
        <div class="result-header">סיכום הזמנה</div>
        <div class="result-body">
            <div class="price-line"><span>סה"כ מוצרים:</span><span id="itemsSubtotal">0 ₪</span></div>
            <div class="price-line"><span>תוספות והתקנה:</span><span id="installSubtotal">0 ₪</span></div>
            <div class="price-line" style="border-top:1px solid #eee; padding-top:10px;"><span>סה"כ לפני מע"מ:</span><span id="totalSub">0 ₪</span></div>
            <div class="price-line"><span>מע"מ (18%):</span><span id="totalVat">0 ₪</span></div>
            <div class="total-line"><span>סה"כ לתשלום:</span><span id="totalFinal">0 ₪</span></div>
            
            <button class="btn-action" style="margin-top:20px; width:100%; background:var(--whatsapp); color:white;" onclick="openPreview()">שלח הצעה בוואטסאפ</button>
        </div>
    </div>
</div>

<div class="bottom-actions" id="bottomNav" style="display:none">
    <button class="btn-action btn-calc" onclick="calculateAll()">חשב סה"כ לתשלום</button>
    <button class="btn-action btn-pdf" onclick="printInvoice()">📄 הפק הצעת מחיר (PDF)</button>
</div>

<div class="modal-overlay" id="previewModal">
    <div class="modal-content">
        <h3 style="text-align:center;margin:0 0 15px 0;color:var(--primary)">טיוטת הודעה</h3>
        <textarea id="previewText" style="width:100%; height:150px; font-family:sans-serif; border:1px solid #ccc; padding:10px; border-radius:10px;"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-login" style="background:#ccc; color:black" onclick="document.getElementById('previewModal').style.display='none'">סגור</button>
            <button class="btn-login" style="background:var(--whatsapp)" onclick="sendWhatsapp()">שלח</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="drawingModal">
    <div class="modal-content" style="max-width:500px">
        <h3 style="text-align:center;margin:0 0 10px 0;">לוח שרטוט ידני</h3>
        <canvas id="drawingPad" width="450" height="300"></canvas>
        <div class="row" style="margin-top:15px">
             <button class="btn-login" style="background:#e53e3e; flex:1" onclick="clearCanvas()">נקה</button>
             <button class="btn-login" style="background:var(--whatsapp); flex:1" onclick="saveDrawing()">שמור שרטוט</button>
             <button class="btn-login" style="background:#ccc; flex:1" onclick="closeDrawing()">ביטול</button>
        </div>
    </div>
</div>

<div id="printArea"></div>

<script>
    // --- נתונים ---
    const profilesDB = {
        "sliding": ["קליל 7000 קלאסי", "קליל 9000", "קליל 9200", "קליל 1700 בלגי", "קליל 2200 אופיס"],
        "pocket": ["כיס בודד (2 נתיבים)", "כיס בודד (3 נתיבים)", "כיס כפול (2 נתיבים)", "כיס כפול (3 נתיבים)"],
        "hinge": ["קליל 4500 קלאסי", "קליל 4300 בלגי", "קליל 5500 באוהאוס", "קליל 4400"],
        "kipp": ["קליל 4500 קיפ", "קליל 4300 קיפ", "קליל 5500 קיפ"],
        "tilt_turn": ["קליל 4500 דריי-קיפ", "קליל 4300 דריי-קיפ", "קליל 5500 דריי-קיפ"],
        "fixed": ["קליל 4300 בלגי FIX", "קליל 4500 קלאסי FIX", "קליל 2000 בייסיק FIX", "קליל 5500 אופיס FIX"],
        "showcase": ["ויטרינה 9000", "ויטרינה 9200", "ויטרינה 2200", "ויטרינה 7000"],
        "door": ["דלת 2000 פנל", "דלת לובי זכוכית", "דלת ציר בלגי 4300", "דלת אינטרקום", "דלת 4500"],
        "shutter": ["שלב 8 (רגיל)", "שלב אור (מיני)", "שלב מוקצף"],
        "screen_roll": ["רשת גלילה (אנכית)", "רשת הזזה", "רשת קבועה"],
        "pergola": ["פרופיל הייטק 120/40", "פרופיל הייטק 150/50", "פרופיל דאבל T", "פרופיל 100/100", "רפפות Z", "רפפות אליפטיות", "דמוי עץ"],
        "fence": ["גדר שלבים אופקיים", "גדר הייטק"],
        "shower": ["מקלחון צירים יוקרתי", "מקלחון הזזה", "אמבטיון"],
        "joker": ["עבודה כללית"]
    };

    const colorsDB = {
        "klil": {
            "iron": ["IRON 100 (לבן)", "IRON 200 (בז')", "IRON 300 (אבן)", "IRON 400 (אפור)", "IRON 420 (שחור)", "IRON 500 (חום)", "IRON 600 (ירוק)", "IRON 700 (כחול)"],
            "fine": ["FINE IRON", "FINE כסף", "FINE שמפניה", "FINE ברונזה", "FINE לבן", "FINE שחור"],
            "elox": ["אנודייז טבעי (מט)", "אנודייז כסף", "אנודייז שמפניה", "אנודייז ברונזה", "אנודייז שחור"],
            "basic": ["לבן 9010", "לבן 9016 (בוהק)", "שמנת 1013", "שחור מט", "אפור 7035", "חום 8014"],
            "office": ["אפור אופיס", "לבן אופיס", "בז' אופיס", "שחור אופיס"]
        },
        "ral": {
            "ral_9xxx": ["9001 (Cream)", "9002 (Grey White)", "9005 (Jet Black)", "9006 (White Alum)", "9007 (Grey Alum)", "9010 (Pure White)", "9016 (Traffic White)"],
            "ral_7xxx": ["7000 (Squirrel Grey)", "7004 (Signal Grey)", "7012 (Basalt Grey)", "7016 (Anthracite)", "7021 (Black Grey)", "7035 (Light Grey)", "7040 (Window Grey)"],
            "ral_1xxx": ["1000", "1013 (Oyster White)", "1015 (Light Ivory)", "1018", "1023"],
            "ral_8xxx": ["8001", "8003", "8014 (Sepia Brown)", "8017 (Chocolate Brown)", "8019"],
            "ral_3xxx": ["3000", "3004", "3020"],
            "ral_5xxx": ["5002", "5005", "5010", "5015"],
            "ral_6xxx": ["6005 (Moss Green)", "6009", "6018", "6021"],
            "ral_2xxx": ["2000", "2004", "2010"],
            "ral_4xxx": ["4001", "4005", "4010"]
        }
    };

    const glassTypes = {
        "types": [
            "טריפלקס 3+3", "טריפלקס 3+4", "טריפלקס 3+5", "טריפלקס 3+6",
            "טריפלקס 4+4", "טריפלקס 4+5", "טריפלקס 4+6",
            "טריפלקס 5+5", "טריפלקס 6+6", "טריפלקס 8+8",
            "בידודית 4-6-4", "בידודית 4-9-4", "בידודית 4-12-4", "בידודית 4-16-4",
            "בידודית 5-9-5", "בידודית 6-9-6", "בידודית 6-12-6",
            "בידודית עם צלון פנימי",
            "מחוסמת 4 מ\"מ", "מחוסמת 5 מ\"מ", "מחוסמת 6 מ\"מ", "מחוסמת 8 מ\"מ", "מחוסמת 10 מ\"מ", "מחוסמת 12 מ\"מ",
            "רגילה 4 מ\"מ", "רגילה 5 מ\"מ", "רגילה 6 מ\"מ"
        ],
        "finish": [
            "שקוף (Clear)", "חלבי (Matte)", "חום (Bronze)", "אפור (Grey)", "ירוק", "כחול",
            "רפלקטיבי (מראה)", "צ'ינצ'ילה", "סבתא", "גרניט", "פסים/תריס"
        ]
    };
    
    const showerGlass = ["מחוסמת 6 מ\"מ", "מחוסמת 8 מ\"מ"];

    let itemCount = 0;
    let activeDrawingBtn = null; 
    
    document.addEventListener('DOMContentLoaded', () => { 
        document.getElementById('quoteDate').valueAsDate = new Date();
        const savedNum = localStorage.getItem('quoteCounter'); 
        document.getElementById('quoteNumber').value = savedNum ? savedNum : 1; 
        if(localStorage.getItem('myAlumDraft')) document.getElementById('draftBtnContainer').style.display = 'block';
    });

    function checkLogin() {
        if(document.getElementById('passwordInput').value === '1234') {
            document.getElementById('loginScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loginScreen').style.display = 'none';
                document.querySelector('.container').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
            }, 500);
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    // --- הוספת מוצרים ---
    function addItem() {
        itemCount++;
        const container = document.getElementById('itemsContainer');
        const div = document.createElement('div');
        div.className = 'card fade-in item-card';
        div.id = `item-${itemCount}`;
        
        div.innerHTML = `
            <div class="card-header-row">
                <div class="card-title">מוצר #${itemCount}</div>
                <button class="btn-delete" onclick="this.closest('.card').remove()">מחק</button>
            </div>

            <label>בחר סוג מוצר:</label>
            <select class="item-type" onchange="updateItemFields(this)">
                <option value="sliding">חלון הזזה</option>
                <option value="pocket">חלון כיס (Pocket)</option>
                <option value="hinge">חלון ציר (רגיל)</option>
                <option value="kipp">חלון קיפ (פתיחה עליונה)</option>
                <option value="tilt_turn">חלון דריי-קיפ (משולב)</option>
                <option value="fixed">חלון קבוע (FIX)</option>
                <option value="showcase">ויטרינה קבועה (Showcase)</option>
                <option value="door">דלתות כניסה / לובי</option>
                <option value="shutter">תריסים</option>
                <option value="screen_roll">רשתות</option>
                <option value="pergola">פרגולות</option>
                <option value="fence">גדרות</option>
                <option value="shower">מקלחונים</option>
                <option value="joker">כללי</option>
            </select>

            <div class="extra-panel"></div>

            <div class="standard-inputs">
                <label>דגם פרופיל:</label><select class="profile-select"><option>בחר מוצר קודם</option></select>
                
                <div class="alum-color-section">
                    <label style="margin-top:10px">גוון אלומיניום:</label>
                    <div class="color-tabs">
                        <div class="tab active" onclick="switchColorTab(this, 'ral')">טמבור / RAL</div>
                        <div class="tab" onclick="switchColorTab(this, 'klil')">קליל</div>
                    </div>
                    <div class="row">
                        <select class="color-family" onchange="updateColorShades(this)"></select>
                        <select class="color-shade"><option>בחר משפחה תחילה</option></select>
                    </div>
                </div>

                <div class="glass-section">
                    <label style="margin-top:10px">זכוכית:</label>
                    <div class="row">
                        <select class="glass-type"></select>
                        <select class="glass-finish"></select>
                    </div>
                </div>

                <div class="dims-section">
                    <div class="row" style="margin-top:15px">
                        <div><label>רוחב (ס"מ)</label><input type="number" class="w-input" placeholder="100"></div>
                        <div><label>גובה (ס"מ)</label><input type="number" class="h-input" placeholder="100"></div>
                    </div>
                </div>
                
                <div class="row" style="margin-top:10px;">
                     <div class="opening-dir-container" style="display:none; flex:1">
                        <label>כיוון פתיחה:</label>
                        <select class="open-dir">
                            <option value="right">ימין</option>
                            <option value="left">שמאל</option>
                        </select>
                     </div>
                </div>

                <div class="row">
                    <div><label>כמות</label><input type="number" class="qty-input" value="1"></div>
                    <div><label style="color:var(--primary)">מחיר יח' (₪)</label><input type="number" class="price-input" placeholder="מחיר פיקס"></div>
                </div>
                
                <div class="svg-preview-container"></div>
                
                <button class="btn-download-sketch" onclick="generateSketch(this)">📸 הורד תמונת שרטוט</button>
            </div>
            
            <div class="joker-panel" style="display:none">
                <label>כותרת העבודה:</label><input type="text" class="joker-title">
                <label>תיאור מפורט:</label><textarea class="joker-desc" rows="3"></textarea>

    // --- מחולל שרטוטי 2D הנדסיים (SVG Builder) ---
    function buildSVG(card, isPrint = false) {
        const type = card.querySelector('.item-type').value;
        if(type === 'joker') return '';

        let w = parseFloat(card.querySelector('.w-input')?.value) || 0;
        let h = parseFloat(card.querySelector('.h-input')?.value) || 0;

        if (type === 'fixed' || type === 'showcase') {
             h = Math.max(parseFloat(card.querySelector('.h-right-input')?.value) || 0, parseFloat(card.querySelector('.h-left-input')?.value) || 0);
        } else if (type === 'shower') {
             h = parseFloat(card.querySelector('.h-input')?.value) || 190;
             if (card.querySelector('.shower-config')?.value !== 'front') {
                 w = (parseFloat(card.querySelector('.w-right-input')?.value)||0) + (parseFloat(card.querySelector('.w-left-input')?.value)||0);
             }
        }
        
        if (w <= 0 || h <= 0) return ''; // אם לא הוזנו מידות, לא נצייר

        let svgHeight = isPrint ? '70px' : '150px'; // גודל דינמי לטופס מול המסך
        const strokeW = Math.max((w+h)/150, 1.5); // עובי הפרופיל מתכוונן אוטומטית לפי קנה המידה
        
        let monoH = 0;
        const cbMono = card.querySelector('.cb-monoblock');
        if (cbMono && cbMono.checked) {
            monoH = parseFloat(card.querySelector('.mono-h')?.value) || 28;
        }

        const totalH = h + monoH;
        let svg = `<svg viewBox="-10 -10 ${w+20} ${totalH+20}" style="max-height:${svgHeight}; width:auto; max-width:100%;" xmlns="http://www.w3.org/2000/svg">`;

        // 1. ציור ארגז תריס (מונובלוק) אם יש
        if (monoH > 0) {
            svg += `<rect x="0" y="0" width="${w}" height="${monoH}" fill="#e2e8f0" stroke="#333" stroke-width="${strokeW}"/>`;
            for(let y=5; y<monoH; y+=monoH/4) {
                svg += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#94a3b8" stroke-width="${strokeW/2}"/>`;
            }
        }

        const startY = monoH;

        // 2. ציור מסגרת המוצר (עיוור / היקפי)
        svg += `<rect x="0" y="${startY}" width="${w}" height="${h}" fill="#f8fafc" stroke="#1e293b" stroke-width="${strokeW*1.2}"/>`;

        // 3. חלוקות ופנים השרטוט לפי סוג המוצר
        if (type === 'sliding') {
            const sashes = parseInt(card.querySelector('.sl-sashes')?.value) || 2;
            const sashW = w / sashes;
            for(let i=0; i<sashes; i++) {
                svg += `<rect x="${i*sashW}" y="${startY}" width="${sashW}" height="${h}" fill="none" stroke="#333" stroke-width="${strokeW}"/>`;
                const midX = (i*sashW) + sashW/2;
                const midY = startY + h/2;
                const a = Math.min(sashW * 0.15, h * 0.1); // גודל חץ ההזזה
                
                if (i%2 === 0) { // חץ ימינה
                    svg += `<polyline points="${midX-a},${midY} ${midX+a},${midY}" fill="none" stroke="#64748b" stroke-width="${strokeW}"/>`;
                    svg += `<polyline points="${midX},${midY-a/2} ${midX+a},${midY} ${midX},${midY+a/2}" fill="none" stroke="#64748b" stroke-width="${strokeW}"/>`;
                } else { // חץ שמאלה
                    svg += `<polyline points="${midX+a},${midY} ${midX-a},${midY}" fill="none" stroke="#64748b" stroke-width="${strokeW}"/>`;
                    svg += `<polyline points="${midX},${midY-a/2} ${midX-a},${midY} ${midX},${midY+a/2}" fill="none" stroke="#64748b" stroke-width="${strokeW}"/>`;
                }
            }
        }
        else if (['hinge', 'kipp', 'tilt_turn', 'door'].includes(type)) {
            const dir = card.querySelector('.open-dir')?.value || 'right';
            if (dir === 'right') {
                svg += `<polyline points="0,${startY} ${w},${startY+h/2} 0,${startY+h}" fill="none" stroke="#94a3b8" stroke-width="${strokeW}" stroke-dasharray="5,5"/>`;
            } else {
                svg += `<polyline points="${w},${startY} 0,${startY+h/2} ${w},${startY+h}" fill="none" stroke="#94a3b8" stroke-width="${strokeW}" stroke-dasharray="5,5"/>`;
            }
            if (['tilt_turn', 'kipp'].includes(type)) {
                svg += `<polyline points="0,${startY+h} ${w/2},${startY} ${w},${startY+h}" fill="none" stroke="#94a3b8" stroke-width="${strokeW}" stroke-dasharray="5,5"/>`;
            }
            if (type === 'door') {
                const handleX = (dir==='right') ? 10 : w-10;
                svg += `<line x1="${handleX}" y1="${startY+h/2-5}" x2="${handleX}" y2="${startY+h/2+15}" stroke="#1e293b" stroke-width="${strokeW*2}" stroke-linecap="round"/>`;
            }
        }
        else if (type === 'fixed' || type === 'showcase') {
            const cols = parseInt(card.querySelector('.div-x')?.value) || 0;
            const rows = parseInt(card.querySelector('.div-y')?.value) || 0;
            if (cols > 0) {
                const colW = w / (cols + 1);
                for (let i = 1; i <= cols; i++) {
                    svg += `<line x1="${i*colW}" y1="${startY}" x2="${i*colW}" y2="${startY+h}" stroke="#333" stroke-width="${strokeW}"/>`;
                }
            }
            if (rows > 0) {
                const rowH = h / (rows + 1);
                for (let j = 1; j <= rows; j++) {
                    svg += `<line x1="0" y1="${startY+j*rowH}" x2="${w}" y2="${startY+j*rowH}" stroke="#333" stroke-width="${strokeW}"/>`;
                }
            }
        }
        else if (type === 'pergola') {
            svg += `<rect x="0" y="${startY}" width="${w}" height="${h*0.1}" fill="#94a3b8" stroke="#1e293b" stroke-width="${strokeW}"/>`; 
            svg += `<line x1="${w*0.1}" y1="${startY+h*0.1}" x2="${w*0.1}" y2="${startY+h}" stroke="#1e293b" stroke-width="${strokeW*2}"/>`; 
            svg += `<line x1="${w*0.9}" y1="${startY+h*0.1}" x2="${w*0.9}" y2="${startY+h}" stroke="#1e293b" stroke-width="${strokeW*2}"/>`; 
        }
        else if (type === 'shower') {
            const isCorner = card.querySelector('.shower-config')?.value === 'corner';
            if (isCorner) {
                const wR = parseFloat(card.querySelector('.w-right-input')?.value)||80;
                const wL = parseFloat(card.querySelector('.w-left-input')?.value)||80;
                const ratio = wL / (wL+wR);
                const midX = w * ratio;
                svg += `<rect x="0" y="${startY}" width="${midX}" height="${h}" fill="#e0f2fe" stroke="#333" stroke-width="${strokeW}"/>`;
                svg += `<rect x="${midX}" y="${startY}" width="${w-midX}" height="${h}" fill="#bae6fd" stroke="#333" stroke-width="${strokeW}"/>`;
                svg += `<line x1="${midX}" y1="${startY}" x2="${midX}" y2="${startY+h}" stroke="#0369a1" stroke-width="${strokeW*2}"/>`; 
            } else {
                svg += `<rect x="0" y="${startY}" width="${w}" height="${h}" fill="#e0f2fe" stroke="#333" stroke-width="${strokeW}"/>`;
                svg += `<circle cx="${w*0.2}" cy="${startY+h/2}" r="${strokeW*2}" fill="#333"/>`;
            }
        }
        else if (type === 'fence') {
            const spaceCm = parseInt(card.querySelector('.fence-space')?.value) || 2;
            const slatH = 10;
            for(let y=startY; y<startY+h; y += (slatH + spaceCm)) {
                svg += `<rect x="0" y="${y}" width="${w}" height="${slatH}" fill="#cbd5e0" stroke="#333" stroke-width="${strokeW/2}"/>`;
            }
        }
        else if (type === 'shutter') {
            for(let y=startY; y<startY+h; y += 15) {
                svg += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#94a3b8" stroke-width="${strokeW}"/>`;
            }
        }

        // 4. טקסטים של מידות (לא יודפס ב-PDF, רק יוצג במסך)
        if (!isPrint) {
            svg += `<text x="${w/2}" y="${totalH+h*0.1}" font-family="Arial" font-size="${Math.max(w,totalH)*0.08}" fill="#e53e3e" text-anchor="middle" dominant-baseline="hanging">${w} ↔</text>`;
            svg += `<text x="${w+w*0.05}" y="${startY+h/2}" font-family="Arial" font-size="${Math.max(w,totalH)*0.08}" fill="#e53e3e" text-anchor="start" dominant-baseline="middle">${h} ↕</text>`;
        }

        svg += `</svg>`;
        return svg;
    }

    function updateLiveSVG(card) {
        const svgContainer = card.querySelector('.svg-preview-container');
        if (!svgContainer) return;
        const svgHTML = buildSVG(card, false);
        if (svgHTML) {
            svgContainer.innerHTML = svgHTML;
            svgContainer.style.display = 'block';
        } else {
            svgContainer.style.display = 'none';
        }
    }

    function updateShowerDims(select) {
        const card = select.closest('.card');
        const config = select.value;
        const dimsSection = card.querySelector('.dims-section');
        const layoutUI = card.querySelector('.shower-layout-ui');
        
        if (config === 'front') {
            dimsSection.innerHTML = `<div class="row" style="margin-top:15px"><div><label>רוחב פתח (ס"מ)</label><input type="number" class="w-input" placeholder="100"></div><div><label>גובה (ס"מ)</label><input type="number" class="h-input" placeholder="190"></div></div>`;
            layoutUI.innerHTML = `<label>הרכב חזית:</label><select class="shower-layout-type"><option value="1wing">כנף אחת</option><option value="2wing">2 כנפיים (פרפר)</option><option value="fix_wing">קבוע + כנף</option><option value="sliding">חזית הזזה</option></select>`;
        } else { // corner
            dimsSection.innerHTML = `<div class="row" style="margin-top:15px"><div><label>רוחב ימין (ס"מ)</label><input type="number" class="w-right-input" placeholder="80"></div><div><label>רוחב שמאל (ס"מ)</label><input type="number" class="w-left-input" placeholder="80"></div><div><label>גובה (ס"מ)</label><input type="number" class="h-input" placeholder="190"></div></div>`;
            layoutUI.innerHTML = `<div class="row"><div><label>צד ימין:</label><select class="shower-side-r"><option value="wing">דלת</option><option value="fix">קבוע</option><option value="fix_wing">קבוע+דלת</option></select></div><div><label>צד שמאל:</label><select class="shower-side-l"><option value="wing">דלת</option><option value="fix">קבוע</option><option value="fix_wing">קבוע+דלת</option></select></div></div>`;
        }
    }

    // --- שילוב ה-SVG לתוך ה-PDF הסופי ---
    function printInvoice() {
        const clientName = document.getElementById('clientName').value || "ישראל ישראלי";
        const quoteDate = new Date(document.getElementById('quoteDate').value).toLocaleDateString('he-IL');
        const quoteNum = document.getElementById('quoteNumber').value || "1";
        
        let htmlContent = `
            <div style="text-align:center; margin-bottom:40px; border-bottom:3px solid #0d47a1; padding-bottom:20px;">
                <h1 style="margin:0; color:#0d47a1; font-size:32px;">יהונתן אלומיניום</h1>
                <p style="margin:5px 0; font-size:18px; color:#555;">הצעת מחיר מקצועית</p>
                <div style="display:flex; justify-content:space-between; margin-top:30px; font-weight:bold; font-size:16px;">
                    <span>לקוח: ${clientName}</span>
                    <span>תאריך: ${quoteDate}</span>
                    <span>מס' הצעה: ${quoteNum}</span>
                </div>
            </div>
            <table style="width:100%; border-collapse:collapse; margin-bottom:20px; text-align:right;">
                <thead>
                    <tr>
                        <th style="width:5%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; -webkit-print-color-adjust: exact; print-color-adjust: exact;">#</th>
                        <th style="width:30%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; -webkit-print-color-adjust: exact; print-color-adjust: exact;">תיאור מוצר</th>
                        <th style="width:20%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:center; -webkit-print-color-adjust: exact; print-color-adjust: exact;">שרטוט</th>
                        <th style="width:15%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:center; -webkit-print-color-adjust: exact; print-color-adjust: exact;">מידות (ס"מ)</th>
                        <th style="width:5%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:center; -webkit-print-color-adjust: exact; print-color-adjust: exact;">כמות</th>
                        <th style="width:10%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:right; -webkit-print-color-adjust: exact; print-color-adjust: exact;">מחיר</th>
                        <th style="width:15%; background-color:#0d47a1 !important; color:white !important; padding:10px; border:1px solid #ddd; text-align:right; -webkit-print-color-adjust: exact; print-color-adjust: exact;">סה"כ</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let index = 1; let itemsSum = 0;
        document.querySelectorAll('.item-card').forEach(card => {
            const typeSelect = card.querySelector('.item-type');
            const type = typeSelect.value;
            const typeName = typeSelect.options[typeSelect.selectedIndex].text;
            let desc = `<b>${typeName}</b>`;
            let dims = ""; let qty = 0, price = 0;

            if(type === 'joker') {
                desc += `<br>${card.querySelector('.joker-title').value} - ${card.querySelector('.joker-desc').value}`;
                qty = parseFloat(card.querySelector('.qty-input-joker').value) || 1;
                price = parseFloat(card.querySelector('.price-input-joker').value) || 0;
                dims = "-";
            } else {
                const profile = card.querySelector('.profile-select').value;
                
                if (type !== 'shower') {
                     const shade = card.querySelector('.color-shade').value;
                     desc += `<br>פרופיל: ${profile}<br>צבע: ${shade}`;
                } else {
                     const hwColor = card.querySelector('.hardware-color').value;
                     desc += `<br>דגם: ${profile}<br>פרזול: ${hwColor}`;
                }

                if(type !== 'pergola' && type !== 'fence' && type !== 'shutter' && type !== 'screen_roll') {
                    const glass = card.querySelector('.glass-type').value;
                    const finish = card.querySelector('.glass-finish').value;
                    desc += `<br>זכוכית: ${glass}, ${finish}`;
                }
                
                let extras = "";
                const cbMono = card.querySelector('.cb-monoblock');
                if(cbMono && cbMono.checked) extras += `<br>מונובלוק: ארגז ${card.querySelector('.mono-h').value} ס"מ, מנוע ${card.querySelector('.mono-motor').value}`;
                const cbSlat = card.querySelector('.cb-slat-blind'); if(cbSlat && cbSlat.checked) extras += `<br>תוספות: תריס שלבים`;
                const cbNet = card.querySelector('.cb-net'); if(cbNet && cbNet.checked) extras += `<br>תוספות: רשת`;
                const cbNetPull = card.querySelector('.cb-net-pull'); if(cbNetPull && cbNetPull.checked) extras += `<br>תוספות: רשת נשלפת`;
                desc += extras;
                
                if (type === 'fixed' || type === 'showcase') {
                     const hR = card.querySelector('.h-right-input').value;
                     const hL = card.querySelector('.h-left-input').value;
                     dims = `${card.querySelector('.w-input').value} / ${hR}-${hL}`;
                } else if (type === 'shower') {
                     const config = card.querySelector('.shower-config').value;
                     const h = card.querySelector('.h-input').value;
                     if (config === 'front') dims = `${card.querySelector('.w-input').value} / ${h}`;
                     else dims = `${card.querySelector('.w-right-input').value}x${card.querySelector('.w-left-input').value} / ${h}`;
                } else {
                     dims = `${card.querySelector('.w-input').value} / ${card.querySelector('.h-input').value}`;
                }
                
                qty = parseFloat(card.querySelector('.qty-input').value) || 1;
                price = parseFloat(card.querySelector('.price-input').value) || 0;
            }
            const total = qty * price; itemsSum += total;
            
            // יצירת השרטוט הייעודי ל-PDF
            const svgPrint = buildSVG(card, true);
            
            const bgColor = index % 2 === 0 ? 'background-color:#f9f9f9 !important;' : '';
            htmlContent += `<tr style="${bgColor} -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                <td style="padding:10px; border:1px solid #ddd;">${index++}</td>
                <td style="padding:10px; border:1px solid #ddd; font-size:13px;">${desc}</td>
                <td style="padding:5px; border:1px solid #ddd; text-align:center; vertical-align:middle; background:#fff;">${svgPrint}</td>
                <td style="padding:10px; border:1px solid #ddd; direction:ltr; text-align:center">${dims}</td>
                <td style="padding:10px; border:1px solid #ddd; text-align:center">${qty}</td>
                <td style="padding:10px; border:1px solid #ddd;">${price.toLocaleString()} ₪</td>
                <td style="padding:10px; border:1px solid #ddd; font-weight:bold;">${total.toLocaleString()} ₪</td>
            </tr>`;
        });

        const install = parseFloat(document.getElementById('installationCost').value) || 0;
        const totalBeforeVat = itemsSum + install;
        const vat = totalBeforeVat * 0.18;
        const finalTotal = totalBeforeVat + vat;

        htmlContent += `
                </tbody>
            </table>
            <div style="float:left; width:350px; margin-top:30px; background:#f8f9fa !important; padding:15px; border:1px solid #ddd; border-radius:8px; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:15px;"><span>סה"כ מוצרים + התקנה:</span><span>${totalBeforeVat.toLocaleString()} ₪</span></div>
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:15px;"><span>מע"מ (18%):</span><span>${vat.toLocaleString()} ₪</span></div>
                <div style="display:flex; justify-content:space-between; padding:10px 0 0 0; margin-top:10px; border-top:2px solid #0d47a1; font-size:18px; font-weight:bold; color:#0d47a1;"><span>סה"כ לתשלום:</span><span>${finalTotal.toLocaleString()} ₪</span></div>
            </div>
            <div style="clear:both"></div>
            <div style="margin-top:60px; font-size:12px; color:#555; border-top:1px solid #ccc; padding-top:15px; line-height: 1.8;">
                * המחיר כולל הובלה והתקנה.<br>* הצעת מחיר זאת משמשת כחוזה עבודה.<br>* הסחורה בבעלות יהונתן אלומיניום עד התשלום המלא.<br>* הצעת מחיר תקפה ל-5 ימי עסקים.<br><strong>בכבוד רב, יהונתן אלומיניום</strong>
            </div>
        `;

        document.getElementById('printArea').innerHTML = htmlContent;
        window.print();
    }
